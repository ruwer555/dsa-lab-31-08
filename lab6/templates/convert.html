<!DOCTYPE html>
<html>
<head>
    <title>Конвертация валют</title>
</head>
<body>
    <h1>Конвертация валюты в рубли</h1>
    <input type="text" id="currency" placeholder="Валюта (например, USD)">
    <input type="number" id="amount" placeholder="Сумма в валюте">
    <button onclick="convert()">Конвертировать</button>
    
    <h3 id="result"></h3>
    
    <br>
    <a href="/">На главную</a>
    
    <script>
        async function convert() {
            let currency = document.getElementById('currency').value;
            let amount = document.getElementById('amount').value;
            let resp = await fetch(`/convert?currency=${currency}&amount=${amount}`);
            if (resp.ok) {
                let data = await resp.json();
                document.getElementById('result').innerHTML = `Результат: ${data.converted_amount} рублей`;
            } else {
                let text = await resp.text();
                document.getElementById('result').innerHTML = `Ошибка: ${text}`;
            }
        }
    </script>
</body>
</html>
