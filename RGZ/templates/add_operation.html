{% extends "base.html" %}

{% block title %}Добавить операцию{% endblock %}

{% block content %}
    <h2>Новая операция</h2>
    <form method="POST" action="/add_operation">
        
        <label>Дата:</label>
        <input type="date" name="date" required><br><br>

        <label>Сумма:</label>
        <input type="number" step="0.01" name="sum" required><br><br>

        <label>Тип:</label>
        <select name="type_operation">
            <option value="income">Доход</option>
            <option value="expense">Расход</option>
        </select><br><br>
        
        <button type="submit">Сохранить</button>
    </form>
{% endblock %}
